; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1152000
board_build.f_cpu = 240000000L
board_build.partitions = partitions/ota_8MB.csv
extra_scripts = scripts/export_bins.py
lib_deps =
	lvgl/lvgl@8.3.11
	bodmer/TFT_eSPI@^2.5.43
	adafruit/Adafruit INA219@^1.2.3
	bblanchon/ArduinoJson@^7.3.1
	arduino-libraries/NTPClient@^3.2.1
	nodaoli/ArduinoUZlib@^1.0.2
	tzapu/WiFiManager@^2.0.17
	robtillaart/INA3221@^0.4.1
	esp32async/ESPAsyncWebServer@^3.7.6
	esp32async/AsyncTCP@^3.3.8

; OTA 升级说明: 固件端使用自定义断点续传 OTA (src/ota_service.cpp, TCP 3232)。
; `pio run --target upload` 默认走 USB 串口烧录 (esptool)。
; 无线 OTA 用: python scripts/espota_resume.py -i <设备IP> -f .pio/build/esp32-s3-devkitc-1/firmware.bin
upload_protocol = esptool
; upload_port = COM3   ; USB 串口烧录时指定端口，不填则自动检测
